name: Grok Bot Galaxy Autonomous Watcher

on:
  schedule:
    - cron: '0 */6 * * *' # Darbojas ik pēc 6 stundām
  workflow_dispatch: # Ļauj palaist manuāli no GitHub Actions cilnes

jobs:
  run-watcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Parallax Autonomous Watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python scripts/autonomous_watcher.py